<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сообщение отправлено</title>
    <style>
        /* Сброс стандартных отступов браузера */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7fa;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .thank-you-card {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            padding: 60px 40px;
            text-align: center;
            max-width: 520px;
            width: 100%;
            border: 1px solid #e1e8f0;
        }

        .icon-wrapper {
            width: 80px;
            height: 80px;
            background-color: #e6f3ff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 30px;
        }

        .icon-check {
            width: 40px;
            height: 40px;
            fill: #0055a5;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #003366; /* Темно-синий, классический для юриспруденции */
            margin-bottom: 15px;
            line-height: 1.3;
        }

        p {
            font-size: 16px;
            color: #555;
            line-height: 1.6;
            margin-bottom: 35px;
        }

        .details-box {
            background-color: #f8faff;
            border-left: 4px solid #0055a5;
            padding: 15px 20px;
            text-align: left;
            margin-bottom: 35px;
            border-radius: 0 8px 8px 0;
        }

        .details-box p {
            font-size: 14px;
            color: #2c3e50;
            margin-bottom: 5px;
        }

        .details-box p:last-child {
            margin-bottom: 0;
        }

        .btn {
            display: inline-block;
            padding: 14px 35px;
            background-color: #0055a5;
            color: #ffffff;
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            border-radius: 6px;
            transition: background-color 0.3s ease, transform 0.2s ease;
            border: 1px solid #0055a5;
        }

        .btn:hover {
            background-color: #004488;
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(0);
        }

        /* Адаптивность для мобильных устройств */
        @media (max-width: 480px) {
            .thank-you-card {
                padding: 40px 25px;
            }
            h1 {
                font-size: 24px;
            }
            p {
                font-size: 15px;
            }
            .btn {
                width: 100%;
                padding: 14px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="thank-you-card">
        <div class="icon-wrapper">
            <!-- Встроенная SVG иконка галочки -->
            <svg class="icon-check" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
            </svg>
        </div>

        <h1>Спасибо за ваше обращение!</h1>
        <p>Мы получили ваше сообщение. Юрист свяжется с вами в ближайшее время для уточнения деталей. Обычно мы отвечаем в течение 15–30 минут в рабочее время.</p>

        <div class="details-box">
            <p><strong>Ваш номер обращения:</strong> #7482-AB</p>
            <p><strong>Дата:</strong> 07.10.2026</p>
        </div>

        <a href="/" class="btn">Вернуться на главную</a>
    </div>

</body>
</html>
